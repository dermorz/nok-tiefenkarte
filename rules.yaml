# Regeln aus dem NOK-Erlaubnisschein ("Jahresschein Mitglieder LAV-SH", via hejfish)
# Stand: abgelesen November 2026 aus der hejfish-App. Bei neuem Schein abgleichen!
# Maßgeblich ist immer der Text des gültigen Erlaubnisscheins.
#
# Ergänzt (ufer.py): "geometrie" legt fest, wo eine Regel liegt. Bezug ist die Kilometrierung des
# Tiefenatlas: gewaesser "NOK" = Kanal-km, sonst die eigene km-Teilung des Bandes (z. B. Borgstedter
# See: km 0,0 am NOK, steigt nach Westen). Grenzen als km oder als OSM-Objekt, dessen Schnittpunkt mit
# dem Ufer die Grenze bildet. Regeln ohne geometrie werden (noch) nicht gezeichnet und im Report gelistet.

quelle:
  ausgeber: Landesangelverband Schleswig-Holstein e. V. (LAV-SH)
  schein: Jahresschein Mitglieder LAV-SH
  abgerufen: 2026-11

geltungsbereich:
  von_km: 1.65   # Binnenhafen Brunsbüttel
  bis_km: 96.63  # Hochbrücke Kiel-Holtenau/Olympiabrücke, senkrechtes Lot der östlichen Außenseite
  auch: [kiel_holtenau]   # außerhalb, aber als Verbot gezeichnet (statt grau)

# Uferlinien, die der Tiefenatlas nicht zeichnet: Rand einer OSM-Wasserfläche (ODbL) von – über – bis
# (lat, lon; nächster Stützpunkt), mit den Regeln, die dort gelten ([] = grün).
extra_ufer:
  - {osm: 53261321, von: [54.31197, 9.70367], ueber: [54.30888, 9.66266], bis: [54.31312, 9.70203],
     gewaesser: Obereider, ufer: Hafen, regeln: [anleger_faehren]}            # Rendsburger Hafen (Umschlagstelle)
  - {osm: 76192053, von: [54.31462, 9.70484], ueber: [54.31722, 9.70695], bis: [54.32597, 9.71351],
     gewaesser: Obereider, ufer: West, regeln: []}                           # Hafenecke bis Borgstedter Brücke

# Uferbereiche, von denen aus der Fischfang NICHT erlaubt ist -> rot
ausgenommen:
  - id: anleger_faehren
    text: "Anlegebrücken und Umschlagstellen, Fähranlagen und Fährzufahrten"
    typ: kategorie
    hinweis: Anleger/Fähren digitalisieren (z. B. aus Tiefenatlas-Basiskarte oder OSM), Puffer festlegen
    geometrie:                      # ergänzt: Objekte aus OSM, je berührtem Uferstück ± puffer_m
      objekte:
        # Fähranlagen/Fährzufahrt: Endpunkte der Fährlinie am Ufer. Die Fährbuchten sind je Seite
        # ~100–300 m lang (Abgleich hejfish), 90 m je Richtung deckt die meisten ab. PRÜFEN
        # ausser: Rendsburg Kreishafen, Fußgänger-Ersatzfähre nur bei Bauarbeiten/Events (dort Steinpackung, frei)
        - {osm: {route: ferry}, enden: true, abstand_m: 60, puffer_m: 90, ausser: [448796387]}
        # Anlegebrücken: Stege/Pieranlagen, die das Ufer berühren
        # ausser: kleine private Stege am Borgstedter See/Enge und Westufer Obereider (bei hejfish grün)
        - {osm: {man_made: pier}, abstand_m: 15, puffer_m: 10, ausser: [117930478, 117930485, 1182773764, 1556540717, 517064726, 1081162622]}
        # Umschlagstellen: Hafen- und Werftflächen (Rendsburg Kreishafen, Nobiskrug, Saatsee …)
        - {osm: {landuse: harbour}, puffer_m: 10}
        - {osm: {landuse: industrial, industrial: [port, shipyard]}, puffer_m: 10}
        # Dalben (Liegestellen in den Weichen) stehen im Wasser, das Ufer dahinter bleibt frei
      abschnitte:                   # von Hand, ohne passendes OSM-Objekt (Abgleich hejfish/vor Ort)
        - {km: [61.53, 61.70], ufer: Süd, grund: befestigter Umschlagplatz Rendsburg/Osterrönfeld}
        - {km: [95.36, 96.51], ufer: Süd, grund: Umschlag-/Industrieufer Kiel-Wik bis vor die Olympiabrücke (wie hejfish)}
        # Zufahrt Obereider: Südufer (Band nennt es "Nord") vom Hafen bis zur Ecke am NOK, wie hejfish
        - {gewaesser: Zufahrt-Obereider, km: [65.40, 65.75], ufer: Nord, bei: [[54.31193, 9.7030], [54.3120, 9.7062], [54.3121, 9.7094]],
           grund: Rendsburger Hafen Südufer}
      frei:                         # von Hand frei, obwohl ein OSM-Objekt das Ufer berührt
        - {km: [61.70, 61.735], ufer: Nord, grund: Kreishafen Rendsburg, Wechsel der Uferbefestigung erst bei km 61,735}
        - {km: [63.00, 63.17], ufer: Nord, grund: Saatsee-Werft, Kanalufer bis zur Molenwurzel (wie hejfish)}
        - {km: [64.08, 64.20], ufer: Nord, grund: Saatsee-Werft, OSM-Fläche reicht über den Hafen hinaus (wie hejfish)}
        - {gewaesser: Borgstedter-See, km: [2.70, 2.86], ufer: Süd, grund: Borgstedter Enge, Hafen Rader Insel liegt gegenüber}
        - {gewaesser: Borgstedter-See, km: [2.70, 2.855], ufer: Nord, grund: Brücke Borgstedter Enge, rot erst ab dem Hafen (wie hejfish)}

  - id: brunsbuettel_haefen
    text: "Betriebs- und Ölhafen Brunsbüttel"
    typ: ort
    hinweis: Hafenflächen als Polygon digitalisieren
    geometrie:                      # ergänzt: Hafen-/Industrieflächen und Anleger aus OSM bis km 6,5
      objekte:
        - {osm: {landuse: [harbour, industrial]}, km: [0, 6.5], puffer_m: 20}
        - {osm: {man_made: pier}, km: [0, 6.5], abstand_m: 15, puffer_m: 20}

  - id: baggerloch_dueckerswisch
    text: "Baggerloch Dückerswisch, km 20,45 bis 20,80 Nord, vom 01.04. bis 15.06."
    typ: km
    ufer: Nord
    von_km: 20.45
    bis_km: 20.80
    zeitraum: {von: "04-01", bis: "06-15"}   # außerhalb: grün, im Zeitraum: rot

  - id: gieselau_audorf_flemhude_achterwehr
    text: >-
      Gieselaukanal, Audorfer See beginnend an den Spitzen des Leitdammes, endend an der
      Uferecke im Bereich des Überganges des Obereidersees mit Enge zum Südufer des
      Audorfer Sees, Flemhuder See, Stichkanal Achterwehrer Schifffahrtskanal
    typ: ort
    hinweis: Mehrere Teilgebiete; Grenzpunkte (Leitdamm-Spitzen, Uferecke) von Hand setzen

  - id: ruesterbergen
    text: "von km 54,8 bis 55,2 Süd (Lotsenstation Rüsterbergen)"
    typ: km
    ufer: Süd
    von_km: 54.8
    bis_km: 55.2

  - id: borgstedter_see_nord
    text: "Nordufer des Borgstedter Sees mit Enge zwischen der Autobahnbrücke Rade und dem NOK/Schirnauer See"
    typ: ort
    ufer: Nord
    hinweis: Grenzpunkte Autobahnbrücke Rade und Übergang NOK/Schirnauer See von Hand setzen und prüfen
    geometrie:                      # ergänzt
      gewaesser: Borgstedter-See
      von: {osm: {bridge:name: Rader Hochbrücke}}   # Schnitt A7-Brücke mit dem Nordufer
      bis: {km: 0.34}               # Ostende wie hejfish (54.3419, 9.7443), östlich davon frei

  - id: borgstedter_see_sued
    text: "Südufer des Borgstedter Sees mit Enge von der westlichen Starkstromleitung über den Borgstedter See bis zum NOK/Schirnauer See"
    typ: ort
    ufer: Süd
    hinweis: Grenzpunkt westliche Starkstromleitung von Hand setzen und prüfen
    geometrie:                      # ergänzt
      gewaesser: Borgstedter-See
      von: {osm: {power: line}, wahl: westlichste}  # westlichste Freileitung, die das Südufer kreuzt
      bis: {km: 0.31}               # Ostende wie hejfish (54.3405, 9.7449), östlich davon frei

  - id: kiel_holtenau
    text: "zwischen Hochbrücke Kiel-Holtenau (Olympiabrücke) und Schleuse Kiel-Holtenau (Nord- und Südufer)"
    typ: km                         # ergänzt: Olympiabrücke km 96,63 bis Schleuse (Abgleich hejfish)
    ufer: beide
    von_km: 96.63
    bis_km: 97.95

  - id: fischereianlagen
    text: "Im unmittelbaren Anlagenbereich (Fischereianlagen der Erwerbsfischer) ist eine Fischereiausübung untersagt."
    typ: nicht_kartierbar

  - id: baustellen_lebendverbau_abbruch
    text: "Ufer mit Baustellen oder mit Lebendverbau sowie abbruchgefährdete Ufer"
    typ: nicht_kartierbar

# Erlaubt, aber mit Einschränkung -> orange (zeitabhängig)
einschraenkungen:
  - id: kunstkoeder_zanderschonzeit_west
    text: >-
      Im gesamten Gewässer westlich der Fähre Sehestedt (km 1,65 bis 75,3) ist das Angeln
      mit Kunstködern während der Zanderschonzeit verboten. Ausgenommen davon sind
      Heringspaternoster.
    typ: km
    ufer: beide
    von_km: 1.65
    bis_km: 75.3
    zeitraum: {von: "03-01", bis: "05-31"}   # Zanderschonzeit laut Schein
    anzeige: "Kunstköderverbot (außer Heringspaternoster)"

  - id: verpachtete_flaechen
    text: "In Bereichen der von der WSV verpachteten oder vermieteten Land- und Wasserflächen ist die Fischereiausübung nur mit Einwilligung des Pächters oder Mieters gestattet."
    typ: nicht_kartierbar

# Immer ausgenommen, unabhängig vom Ufer
allgemein:
  - "Fischfang von Wasserfahrzeugen aus ist von der Erlaubnis ausgenommen."
  - "Betreten der Betriebsanlagen (z. B. Schleusengelände, Hafenanlagen) verboten; es gilt die Wasserstraßen-Betriebsanlagenverordnung."
